name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/loonghfut/siyuan-database-display.git
          git fetch --prune upstream main

      - name: Sync upstream tree
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Upstream is already included."
            exit 0
          fi

          backup="$(mktemp -d)"
          mkdir -p "$backup/.github/workflows" "$backup/scripts"
          cp .github/workflows/sync-upstream.yml "$backup/.github/workflows/"
          cp .github/workflows/free-release.yml "$backup/.github/workflows/"
          cp scripts/ensure-free-edition.mjs "$backup/scripts/"

          git merge --no-ff --no-edit --no-commit -s ours upstream/main
          git checkout upstream/main -- .

          mkdir -p .github/workflows scripts
          cp "$backup/.github/workflows/sync-upstream.yml" .github/workflows/
          cp "$backup/.github/workflows/free-release.yml" .github/workflows/
          cp "$backup/scripts/ensure-free-edition.mjs" scripts/

          node scripts/ensure-free-edition.mjs
          rm -f .github/workflows/release.yml

          git add -A
          git diff --cached --check
          git commit --no-edit --message "chore(sync): sync upstream and reapply free edition policy"
          git push origin main
          rm -rf "$backup"
