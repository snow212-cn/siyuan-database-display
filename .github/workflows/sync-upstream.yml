name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/loonghfut/siyuan-database-display.git
          git fetch --prune upstream main

      - name: Merge upstream
        run: |
          set -euo pipefail
          git merge --no-edit -X theirs upstream/main

      - name: Reapply free edition policy
        run: |
          set -euo pipefail
          node scripts/ensure-free-edition.mjs
          if [ -f .github/workflows/release.yml ]; then
            git rm -f .github/workflows/release.yml
          fi
          if ! git diff --quiet; then
            git add src/licensing/pro-access-service.ts .github/workflows/release.yml
            git commit -m "chore(sync): reapply free edition policy"
          fi

      - name: Push synced main
        run: git push origin main
